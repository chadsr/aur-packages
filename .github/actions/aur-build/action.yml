name: 'Build AUR builder image'
description: 'Builds the Arch Linux builder image (yay + tools) with GitHub Actions layer caching, keyed on the pacman version. Loads it locally as aur-builder:latest for the downstream docker action.'
runs:
  using: composite
  steps:
    - name: Get current pacman version
      id: pacman
      shell: bash
      run: |
        ver=$(curl -fsSL https://archlinux.org/packages/core/x86_64/pacman/json/ | jq -r '.pkgver')
        echo "ver=$ver" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Build builder image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .github/actions/aur
        file: .github/actions/aur/Dockerfile
        tags: aur-builder:latest
        load: true
        cache-from: type=gha,ref=aur-builder-${{ steps.pacman.outputs.ver }}-${{ hashFiles('.github/actions/aur/Dockerfile', '.github/actions/aur/entrypoint.sh') }}
        cache-to: type=gha,ref=aur-builder-${{ steps.pacman.outputs.ver }}-${{ hashFiles('.github/actions/aur/Dockerfile', '.github/actions/aur/entrypoint.sh') }},mode=max
