name: publish
on:
  push:
    branches:
      - main
    paths:
      - '*/PKGBUILD'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  find-packages:
    name: Find changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.packages.outputs.count }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find updated packages
        id: packages
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          packages=$(.github/scripts/find-changed-packages.sh "$BASE_SHA" "$HEAD_SHA")
          echo "count=$(jq length <<<"$packages")" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
  publish:
    name: Publish ${{ matrix.pkgbuild }}
    needs: find-packages
    environment: publish
    if: ${{ needs.find-packages.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        pkgbuild: ${{ fromJSON(needs.find-packages.outputs.packages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get PKGBUILD version
        id: pkgbuild_version
        env:
          PKGBUILD_DIR: ${{ matrix.pkgbuild }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          source "$PKGBUILD_DIR/PKGBUILD"
          echo "version=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"
      - name: Publish package
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkgbuild }}
          asset_dir: ${{ matrix.pkgbuild }}/
          commit_message: '${{ matrix.pkgbuild }} ${{ steps.pkgbuild_version.outputs.version }}'
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
