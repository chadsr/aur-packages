on:
  push:
    branches:
      - main
  pull_request:
name: CI
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
          cache: false
      - name: Compute mise cache key
        id: mise-versions
        run: echo "key=mise-$(mise current | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.mise-versions.outputs.key }}
      - name: Install tools
        run: mise install
      - name: Check all files (main)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- hk check --all
      - name: Check changed files (PR)
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- hk check --from-ref origin/main --to-ref HEAD
  lint-namcap:
    name: Lint PKGBUILDs (namcap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install namcap
        run: pacman -Syu --noconfirm --needed namcap
      - name: Check PKGBUILDs with namcap
        run: .github/scripts/namcap-pkgbuild.sh
